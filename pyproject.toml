[project]
name = "sharingface"
version = "0.1.0"
description = "A bilingual, community-powered photo comparison game."
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2.8,<5.3",
    "django-imagekit>=6.1,<7",
    "Pillow>=11.3,<13",
]

[project.optional-dependencies]
production = ["gunicorn>=23,<24"]

[tool.setuptools.packages.find]
include = ["sharingface*", "arena*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
